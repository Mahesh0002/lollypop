<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lollypop</title>
<style>
/* ===== Design tokens (Phase 1 source of truth) ===== */
:root {
  --color-bg-base: #181818;
  --color-bg-elevated: #1f1f1f;
  --color-bg-overlay: rgba(24, 24, 24, 0.85);
  --color-bg-blur: rgba(24, 24, 24, 0.72);

  --color-fg-primary: #ffffff;
  --color-fg-secondary: #b3b3b3;
  --color-fg-tertiary: #8e8e8e;
  --color-fg-disabled: #4a4a4a;

  --color-accent: #fa233b;
  --color-accent-hover: #ff3b4f;
  --color-accent-muted: rgba(250, 35, 59, 0.15);

  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-focus: #fa233b;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-8: 32px; --space-10: 40px; --space-12: 48px;

  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter',
               system-ui, 'Cantarell', 'Noto Sans', sans-serif;

  --text-xs: 0.75rem;   --text-sm: 0.875rem; --text-base: 1rem;
  --text-lg: 1.125rem;  --text-xl: 1.25rem;  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem; --text-4xl: 2.25rem;

  --font-light: 300; --font-regular: 400; --font-medium: 500;
  --font-semibold: 600; --font-bold: 700;

  --radius-sm: 4px;  --radius-md: 8px;   --radius-lg: 12px;
  --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);

  --blur-md: 20px;
  --duration-fast: 120ms;
  --duration-normal: 200ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--color-bg-base);
  color: var(--color-fg-primary);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body { padding: var(--space-12); }

h1 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-4xl);
  font-weight: var(--font-bold);
  line-height: 1.2;
  letter-spacing: -0.02em;
}

.sub { color: var(--color-fg-secondary); font-size: var(--text-lg); margin: 0 0 var(--space-8); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  background: var(--color-accent-muted);
  color: var(--color-accent);
  font-size: var(--text-xs);
  font-weight: var(--font-semibold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.badge.off { background: rgba(142,142,142,0.15); color: var(--color-fg-tertiary); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--space-6);
  max-width: 1400px;
}

.card { text-align: left; }
.art {
  aspect-ratio: 1;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: linear-gradient(135deg, #2a2a2a, #161616);
  box-shadow: var(--shadow-md);
  transition: transform var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out),
              filter var(--duration-normal);
  display: grid;
  place-items: center;
  font-size: var(--text-3xl);
  font-weight: var(--font-light);
  color: var(--color-fg-disabled);
}
.card:hover .art {
  transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-lg);
  filter: brightness(0.9);
}
.card h3 {
  margin: var(--space-3) 0 2px;
  font-size: var(--text-base);
  font-weight: var(--font-semibold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card p { margin: 0; font-size: var(--text-sm); color: var(--color-fg-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.log {
  margin-top: var(--space-8);
  max-width: 1400px;
  padding: var(--space-4);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: var(--text-xs);
  color: var(--color-fg-tertiary);
  max-height: 220px;
  overflow-y: auto;
}
.log div { padding: 2px 0; }
.log .in  { color: #7ee787; }
.log .out { color: #79c0ff; }

button {
  font: inherit;
  font-weight: var(--font-semibold);
  font-size: var(--text-sm);
  color: #fff;
  background: var(--color-accent);
  border: 0;
  border-radius: var(--radius-full);
  padding: var(--space-2) var(--space-5);
  cursor: pointer;
  transition: background var(--duration-fast), transform var(--duration-fast);
}
button:hover { background: var(--color-accent-hover); }
button:active { transform: scale(0.98); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(250,35,59,0.4); }
button.ghost { background: transparent; color: var(--color-fg-secondary);
  box-shadow: inset 0 0 0 1px var(--color-border); }
button.ghost:hover { background: rgba(255,255,255,0.06); color: var(--color-fg-primary); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-fg-secondary); }
</style>
</head>
<body>

<span id="status" class="badge off"><span class="dot"></span>bridge offline</span>
<h1>Lollypop</h1>
<p class="sub">Apple Music UI &mdash; WebView scaffold</p>

<button id="req">Request library</button>
<button id="ping" class="ghost">Ping host</button>

<div class="grid" id="grid" aria-label="Albums"></div>

<div class="log" id="log" role="log" aria-live="polite"></div>

<script>
(function () {
  var log = document.getElementById('log');
  var statusEl = document.getElementById('status');
  var grid = document.getElementById('grid');

  function line(dir, text) {
    var el = document.createElement('div');
    el.className = dir;
    el.textContent = (dir === 'in' ? '< ' : '> ') + text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function bridge() {
    if (window.pybridge) { return window.pybridge; }
    // Running outside the app (plain browser) — log-only stub.
    return {
      send: function (m) { line('out', JSON.stringify(m) + '  (no host)'); },
      on: function () { return function () {}; }
    };
  }
  var py = bridge();

  function setOnline(on) {
    statusEl.className = 'badge' + (on ? '' : ' off');
    statusEl.innerHTML = '<span class="dot"></span>' +
      (on ? 'bridge connected' : 'bridge offline');
  }

  py.on('HOST_READY', function (payload) {
    setOnline(true);
    line('in', 'HOST_READY ' + JSON.stringify(payload));
    py.send({ type: 'GET_LIBRARY' });
  });

  py.on('LIBRARY_LOADED', function (payload) {
    line('in', 'LIBRARY_LOADED ' + JSON.stringify(payload).slice(0, 400));
    render(payload && payload.albums ? payload.albums : []);
  });

  py.on('PLAYBACK_STATE', function (payload) {
    line('in', 'PLAYBACK_STATE ' + JSON.stringify(payload));
  });

  py.on('*', function (message) {
    line('in', message.type);
  });

  function render(albums) {
    grid.textContent = '';
    albums.slice(0, 60).forEach(function (album, i) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="art">' + (i + 1) + '</div>' +
        '<h3></h3><p></p>';
      card.querySelector('h3').textContent = album.name || 'Untitled';
      card.querySelector('p').textContent = album.artist_name ||
        (album.artists || []).join(', ') || '';
      card.addEventListener('click', function () {
        py.send({ type: 'PLAY', payload: { trackId: album.id } });
      });
      grid.appendChild(card);
    });
  }

  document.getElementById('req').addEventListener('click', function () {
    py.send({ type: 'GET_LIBRARY' });
  });
  document.getElementById('ping').addEventListener('click', function () {
    py.send({ type: 'NAVIGATE',
              payload: { view: 'albums' } });
  });

  if (window.pybridge) { setOnline(true); line('in', 'pybridge injected'); }
  else { line('out', 'pybridge not injected — open inside Lollypop'); }
})();
</script>
</body>
</html>
